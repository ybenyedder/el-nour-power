<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Soleil : cercle + rayons -->
  <g fill="none" stroke="#0a7d3b" stroke-width="3" stroke-linecap="round">
    <circle cx="50" cy="50" r="34" fill="#e8f3ec" stroke="#0a7d3b" stroke-width="3"/>
    <!-- rayons -->
    <line x1="50" y1="6" x2="50" y2="16"/>
    <line x1="50" y1="84" x2="50" y2="94"/>
    <line x1="6" y1="50" x2="16" y2="50"/>
    <line x1="84" y1="50" x2="94" y2="50"/>
    <line x1="18" y1="18" x2="25" y2="25"/>
    <line x1="75" y1="75" x2="82" y2="82"/>
    <line x1="18" y1="82" x2="25" y2="75"/>
    <line x1="75" y1="25" x2="82" y2="18"/>
  </g>
  <!-- Panneau solaire à l'intérieur du cercle -->
  <g>
    <rect x="30" y="36" width="40" height="28" rx="2" fill="#0a7d3b"/>
    <!-- cellules du panneau (grille 4x3) -->
    <g stroke="#e8f3ec" stroke-width="1.2" fill="none">
      <line x1="40" y1="36" x2="40" y2="64"/>
      <line x1="50" y1="36" x2="50" y2="64"/>
      <line x1="60" y1="36" x2="60" y2="64"/>
      <line x1="30" y1="45.3" x2="70" y2="45.3"/>
      <line x1="30" y1="54.6" x2="70" y2="54.6"/>
    </g>
  </g>
</svg>
